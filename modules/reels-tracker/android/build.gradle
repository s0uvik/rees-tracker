plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.reelstracker'
version = '0.1.0'

android {
  namespace "expo.modules.reelstracker"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
  testOptions {
    // Pure-logic classes are tested on the JVM; anything that touches the
    // Android framework returns defaults instead of throwing "Stub!".
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
}
